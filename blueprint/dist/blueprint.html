    <style>/*
 * Blueprint - design tokens
 *
 * DESIGN READ
 *   Daily-use product UI for one committed person on a phone, opened twice a
 *   day, half-awake. Instrument, not wellness app. The visual job is to make
 *   an honest evidence tier legible at a glance and to make a graded habit
 *   look materially different from an unproven one.
 *
 * DIALS
 *   DESIGN_VARIANCE  4   Predictable. You use this at 7am. Surprise is a bug.
 *   MOTION_INTENSITY 4   Feedback and state transitions only. Nothing loops.
 *   VISUAL_DENSITY   6   A daily log with real data in it.
 *
 * PALETTE
 *   Deliberately not the warm beige, brass and espresso family that every
 *   wellness product defaults to. Neutrals carry a faint cool-green cast so
 *   the app reads as a measuring instrument.
 *
 *   ONE accent, a signal green, used identically on every screen.
 *   Amber appears only as a data semantic: a measurement over its threshold,
 *   or something overdue. It is never decoration and never a second accent.
 *
 * SHAPE LOCK
 *   14px on surfaces, 10px on controls, full radius on pills and toggles.
 *   No exceptions anywhere in the app.
 *
 * TYPE
 *   Space Grotesk for everything structural, IBM Plex Mono for every number,
 *   date, and tier label. Both self-hosted so the app works offline on a
 *   plane, which is the whole point of it being a PWA.
 *
 * CONTRAST
 *   --text-3 carries real content: habit subtitles, evidence grades, chart
 *   axes. So it is set to clear WCAG AA against the darkest surface it ever
 *   sits on, which is --sunken, not against the lightest. Lightening it back
 *   toward a prettier grey reintroduces a 3.9:1 failure on sunken rows.
 */

:root {
  color-scheme: light;

  --page: #f3f5f2;
  --surface: #fbfcfa;
  --sunken: #e9ece7;
  --hover: #eef1ec;

  --text-1: #14180f;
  --text-2: #565c50;
  --text-3: #666b61;

  --line: #dfe3da;
  --line-strong: #c5ccbe;

  --accent: #0d7a49;
  --accent-hover: #0a6039;
  --accent-ink: #fbfcfa;
  --accent-wash: #e2f1e8;

  --warn: #8a5d06;
  --warn-wash: #f7edd9;

  --r-surface: 14px;
  --r-control: 10px;

  --sans: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", monospace;

  --tap: 44px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0b0d0a;
    --surface: #131612;
    --sunken: #0f1210;
    --hover: #1b1f19;
    --text-1: #eef1ea;
    --text-2: #a2a99c;
    --text-3: #828a7d;
    --line: #242821;
    --line-strong: #363c33;
    --accent: #4ad588;
    --accent-hover: #6ae0a1;
    --accent-ink: #0b0d0a;
    --accent-wash: #11241a;
    --warn: #d9a851;
    --warn-wash: #241d0f;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0b0d0a;
  --surface: #131612;
  --sunken: #0f1210;
  --hover: #1b1f19;
  --text-1: #eef1ea;
  --text-2: #a2a99c;
  --text-3: #828a7d;
  --line: #242821;
  --line-strong: #363c33;
  --accent: #4ad588;
  --accent-hover: #6ae0a1;
  --accent-ink: #0b0d0a;
  --accent-wash: #11241a;
  --warn: #d9a851;
  --warn-wash: #241d0f;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-color: var(--line);
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  background: var(--page);
  color: var(--text-1);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

.num {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  background: none;
  border: none;
  cursor: pointer;
  transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease),
    transform 0.1s var(--ease), color 0.15s var(--ease);
}

button:active:not(:disabled) {
  transform: scale(0.985);
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ------------------------------------------------------------- structure */

.shell {
  min-height: 100dvh;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 56px;
  padding: 10px 16px calc(10px + env(safe-area-inset-top)) 16px;
  padding-top: calc(10px + env(safe-area-inset-top));
  background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}

@supports not (backdrop-filter: blur(1px)) {
  .topbar {
    background: var(--page);
  }
}

.topbar h1 {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.03em;
}

.topbar .date {
  display: block;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--text-3);
  letter-spacing: 0.02em;
}

.view {
  padding: 20px 16px 32px;
  max-width: 720px;
  margin: 0 auto;
}

.view > * + * {
  margin-top: 24px;
}

/* Section rhythm: rules and space, not a card around everything. */
.block > h2 {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text-2);
  margin-bottom: 10px;
}

.block > .lede {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.55;
  margin: -4px 0 12px;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-surface);
  overflow: hidden;
}

.rows > * + * {
  border-top: 1px solid var(--line);
}

/* ---------------------------------------------------------------- header */

.score {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px;
}

.ring {
  flex: 0 0 auto;
  width: 68px;
  height: 68px;
  transform: rotate(-90deg);
}

.ring circle {
  fill: none;
  stroke-width: 7;
  stroke-linecap: round;
}

.ring .track {
  stroke: var(--sunken);
}

.ring .fill {
  stroke: var(--accent);
  transition: stroke-dashoffset 0.6s var(--ease);
}

.score-figure {
  font-family: var(--mono);
  font-size: 30px;
  font-weight: 500;
  letter-spacing: -0.045em;
  line-height: 1;
}

.score-figure sup {
  font-size: 14px;
  font-weight: 400;
  color: var(--text-3);
  margin-left: 1px;
  top: -0.55em;
  position: relative;
}

.score-label {
  font-size: 13px;
  color: var(--text-2);
  margin-top: 5px;
  line-height: 1.4;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--line);
}

.stats > div {
  padding: 12px 14px;
}

.stats > div + div {
  border-left: 1px solid var(--line);
}

.stats dt {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-3);
  margin-bottom: 3px;
}

.stats dd {
  font-family: var(--mono);
  font-size: 17px;
  font-weight: 500;
  letter-spacing: -0.03em;
}

/* ----------------------------------------------------------- habit rows */

.hrow {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: var(--tap);
  padding: 11px 14px;
  text-align: left;
  background: var(--surface);
}

.hrow:hover {
  background: var(--hover);
}

.tick {
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  border-radius: 999px;
  border: 1.5px solid var(--line-strong);
  display: grid;
  place-items: center;
  color: transparent;
  transition: background-color 0.18s var(--ease), border-color 0.18s var(--ease),
    color 0.18s var(--ease);
}

.tick svg {
  width: 15px;
  height: 15px;
}

.hrow[aria-pressed="true"] .tick,
.tick.on {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

/* Experimental habits get a dashed tick. It is a different kind of thing and
   it should not look like a win when you fill it in. */
.hrow.experimental .tick {
  border-style: dashed;
}

.hrow.experimental[aria-pressed="true"] .tick {
  background: transparent;
  border-color: var(--text-3);
  border-style: solid;
  color: var(--text-2);
}

.hbody {
  flex: 1 1 auto;
  min-width: 0;
}

.hname {
  font-size: 14.5px;
  font-weight: 500;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 7px;
}

.hrow[aria-pressed="true"] .hname {
  color: var(--text-2);
}

.hsub {
  font-size: 12.5px;
  color: var(--text-3);
  margin-top: 1px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.hval {
  flex: 0 0 auto;
  min-width: 52px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-3);
  text-align: right;
  white-space: nowrap;
}

.hval b {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--text-1);
  letter-spacing: -0.03em;
  margin-right: 2px;
}

/* An unfilled value should read as absent, not as a value of "minus". */
.hval.none b {
  color: var(--text-3);
}

.hrow .info {
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  margin-right: -6px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  color: var(--text-3);
}

.hrow .info:hover {
  background: var(--sunken);
  color: var(--text-1);
}

.hrow .info svg {
  width: 17px;
  height: 17px;
}

/* --------------------------------------------------------------- badges */

.tier {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  padding: 2px 6px;
  border-radius: 999px;
  white-space: nowrap;
}

.tier.foundation {
  background: var(--accent-wash);
  color: var(--accent);
}

.tier.compounding {
  background: var(--sunken);
  color: var(--text-2);
}

.tier.experimental {
  background: transparent;
  color: var(--text-3);
  border: 1px dashed var(--line-strong);
}

.ev {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text-3);
  letter-spacing: 0.01em;
}

/* --------------------------------------------------------------- buttons */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--tap);
  padding: 0 18px;
  border-radius: var(--r-control);
  font-size: 14.5px;
  font-weight: 500;
  letter-spacing: -0.01em;
  background: var(--accent);
  color: var(--accent-ink);
}

.btn:hover {
  background: var(--accent-hover);
}

.btn svg {
  width: 17px;
  height: 17px;
}

.btn.ghost {
  background: transparent;
  color: var(--text-1);
  border: 1px solid var(--line-strong);
}

.btn.ghost:hover {
  background: var(--hover);
}

.btn.quiet {
  background: transparent;
  color: var(--text-2);
  min-height: 36px;
  padding: 0 10px;
  font-size: 13px;
}

.btn.quiet:hover {
  background: var(--sunken);
  color: var(--text-1);
}

.btn.danger {
  background: transparent;
  border: 1px solid var(--line-strong);
  color: var(--warn);
}

.btn.full {
  width: 100%;
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

/* ---------------------------------------------------------------- forms */

.field {
  display: grid;
  gap: 6px;
  margin-bottom: 16px;
}

.field label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-1);
}

.field .help {
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.5;
}

.field .err {
  font-size: 12px;
  color: var(--warn);
}

input[type="text"],
input[type="number"],
input[type="date"],
input[type="time"],
select,
textarea {
  width: 100%;
  min-height: var(--tap);
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-control);
  font-size: 16px; /* iOS zooms the page below 16px on focus. */
  transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
}

textarea {
  min-height: 88px;
  resize: vertical;
  line-height: 1.5;
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-wash);
}

input::placeholder,
textarea::placeholder {
  color: var(--text-3);
}

/* ----------------------------------------------------------------- tabs */

.tabbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}

@supports not (backdrop-filter: blur(1px)) {
  .tabbar {
    background: var(--surface);
  }
}

.tabbar button {
  display: grid;
  justify-items: center;
  gap: 3px;
  padding: 9px 4px 8px;
  color: var(--text-3);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.01em;
  min-height: 56px;
}

.tabbar button svg {
  width: 21px;
  height: 21px;
}

.tabbar button[aria-selected="true"] {
  color: var(--accent);
}

/* --------------------------------------------------------------- sheet */

.scrim {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgb(0 0 0 / 0.42);
  animation: fade 0.2s var(--ease);
}

.sheet {
  position: fixed;
  z-index: 41;
  left: 0;
  right: 0;
  bottom: 0;
  max-height: 88dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--surface);
  border-radius: var(--r-surface) var(--r-surface) 0 0;
  border-top: 1px solid var(--line);
  padding: 8px 18px calc(24px + env(safe-area-inset-bottom));
  animation: rise 0.28s var(--ease);
}

.grabber {
  width: 36px;
  height: 4px;
  border-radius: 999px;
  background: var(--line-strong);
  margin: 6px auto 14px;
}

.sheet h2 {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1.2;
}

.sheet .meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 10px 0 16px;
  flex-wrap: wrap;
}

.sheet p {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-2);
}

.sheet p + p {
  margin-top: 12px;
}

.sheet .actions {
  display: grid;
  gap: 10px;
  margin-top: 22px;
}

@keyframes rise {
  from {
    transform: translateY(14px);
    opacity: 0;
  }
}

@keyframes fade {
  from {
    opacity: 0;
  }
}

/* Claim and counter, side by side in the reading order that matters. */
.claim {
  border-left: 2px solid var(--line-strong);
  padding: 2px 0 2px 12px;
  margin-top: 14px;
}

.claim .who {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-3);
  margin-bottom: 5px;
}

.claim.counter {
  border-left-color: var(--accent);
}

.caution {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: var(--r-control);
  background: var(--warn-wash);
  font-size: 13px;
  line-height: 1.55;
  color: var(--text-1);
}

.caution strong {
  color: var(--warn);
  font-weight: 600;
}

.source {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.5;
  color: var(--text-3);
}

/* --------------------------------------------------------------- charts */

.spark {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 46px;
  padding: 12px 14px 0;
}

.spark span {
  flex: 1 1 0;
  border-radius: 2px 2px 0 0;
  background: var(--accent);
  min-height: 2px;
  transition: height 0.4s var(--ease);
}

.spark span.off {
  background: var(--sunken);
}

.axis {
  display: flex;
  justify-content: space-between;
  padding: 6px 14px 12px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-3);
}

.line {
  width: 100%;
  height: 130px;
  display: block;
}

.line path {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.line .threshold {
  stroke: var(--warn);
  stroke-width: 1;
  stroke-dasharray: 3 3;
}

.line circle {
  fill: var(--accent);
}

/* ---------------------------------------------------------------- misc */

.empty {
  padding: 34px 22px;
  text-align: center;
}

.empty svg {
  width: 26px;
  height: 26px;
  color: var(--text-3);
  margin-bottom: 10px;
}

.empty h3 {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}

.empty p {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.55;
  max-width: 34ch;
  margin: 0 auto;
}

.empty .btn {
  margin-top: 18px;
}

.note {
  display: flex;
  gap: 10px;
  padding: 13px 14px;
  border-radius: var(--r-control);
  background: var(--sunken);
  font-size: 13px;
  line-height: 1.55;
  color: var(--text-2);
}

.note svg {
  flex: 0 0 auto;
  width: 17px;
  height: 17px;
  margin-top: 1px;
  color: var(--text-3);
}

.note.warn {
  background: var(--warn-wash);
}

.note.warn svg {
  color: var(--warn);
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 13px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
  background: var(--surface);
}

.chip[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

.chiprow {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.toggle {
  flex: 0 0 auto;
  width: 46px;
  height: 28px;
  border-radius: 999px;
  background: var(--line-strong);
  padding: 3px;
  transition: background-color 0.2s var(--ease);
}

.toggle i {
  display: block;
  width: 22px;
  height: 22px;
  border-radius: 999px;
  background: var(--surface);
  transition: transform 0.2s var(--ease);
}

.toggle[aria-pressed="true"] {
  background: var(--accent);
}

.toggle[aria-pressed="true"] i {
  transform: translateX(18px);
}

.thumbs {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 8px;
  padding: 14px;
}

.thumbs figure {
  border-radius: var(--r-control);
  overflow: hidden;
  background: var(--sunken);
  aspect-ratio: 3 / 4;
  position: relative;
}

.thumbs img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.thumbs figcaption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 12px 7px 5px;
  background: linear-gradient(to top, rgb(0 0 0 / 0.62), transparent);
  color: #fff;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.01em;
}

.skel {
  background: var(--sunken);
  border-radius: var(--r-control);
  animation: pulse 1.4s ease-in-out infinite;
}

@keyframes pulse {
  50% {
    opacity: 0.55;
  }
}

.hidden {
  display: none !important;
}

/* Desktop is the secondary target. The layout widens, the tab bar moves to
   the side, nothing else changes. */
@media (min-width: 900px) {
  .shell {
    padding-bottom: 0;
    padding-left: 214px;
  }

  .tabbar {
    top: 0;
    right: auto;
    width: 214px;
    grid-template-columns: 1fr;
    align-content: start;
    gap: 2px;
    padding: 74px 12px 12px;
    border-top: none;
    border-right: 1px solid var(--line);
    background: var(--surface);
  }

  .tabbar button {
    grid-template-columns: 21px 1fr;
    justify-items: start;
    align-items: center;
    gap: 11px;
    min-height: 44px;
    padding: 0 12px;
    border-radius: var(--r-control);
    font-size: 14px;
  }

  .tabbar button[aria-selected="true"] {
    background: var(--accent-wash);
  }

  .topbar {
    padding-left: 230px;
  }

  .sheet {
    left: 50%;
    bottom: auto;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(560px, calc(100vw - 48px));
    border-radius: var(--r-surface);
    border: 1px solid var(--line);
    animation: pop 0.24s var(--ease);
  }

  @keyframes pop {
    from {
      transform: translate(-50%, calc(-50% + 10px));
      opacity: 0;
    }
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

    <script>
      (function () {
        "use strict";

/* ---- js/habits.js ---- */
/**
 * The corpus.
 *
 * Every habit in the app, with the evidence behind it stated plainly. This
 * file is the reason the app exists: a checklist that treats "sleep 8 hours"
 * and "press your thumbs against your palate" as equivalent is lying to you
 * by omission, because ticking the cheap one feels identical to ticking the
 * one that works.
 *
 * So each habit carries a tier and an evidence grade, and the daily score is
 * computed from graded habits only. Unproven habits are tracked in full,
 * never scored, and can be promoted into a real n=1 experiment with a locked
 * baseline. That is the honest version of "it worked for me".
 *
 * TIERS
 *   foundation    Large effect, well evidenced. Weighted double in the score.
 *   compounding   Real effect, smaller or slower. Weighted single.
 *   experimental  Mechanism disputed or unsupported. Never scored.
 *
 * EVIDENCE
 *   established   Controlled trials, meta-analyses, or consensus guidance.
 *   supported     Reasonable evidence, smaller effect, or standard practice.
 *   contested     A real effect exists but not the one usually claimed.
 *   unproven      No clinical support for the mechanism as stated.
 */

const TIERS = {
  foundation: { label: "Foundation", weight: 2, scored: true },
  compounding: { label: "Compounding", weight: 1, scored: true },
  experimental: { label: "Experimental", weight: 0, scored: false },
};

const EVIDENCE = {
  established: { label: "Established", rank: 4 },

};

    evidence: "contested",
    cadence: "daily",
    defaultOn: false,
    claim: "Daily cold exposure improves skin, circulation and appearance.",
    counter:
      "Evidence for an appearance benefit is essentially nil. Evidence for mood and alertness is modest and real, which is a fine reason to do it.",
    caution:
      "Cold immersion straight after a hypertrophy session can blunt muscle adaptation. Do it in the morning, not after you lift.",
    source: "Cold exposure literature; post-exercise cooling and hypertrophy",
  },
];

/* ------------------------------------------------------------------ */

const BY_ID = Object.fromEntries(HABITS.map((h) => [h.id, h]));

/** Resolve a habit's target for a given bodyweight. */
function targetFor(habit, bodyweightKg) {
  const input = habit.input;
  if (!input) return null;
  if (typeof input.perKg === "number") return Math.round(input.perKg * bodyweightKg);
  return input.target;
}

/** A numeric habit counts as met once it clears its floor. */
function meetsTarget(habit, value, bodyweightKg) {
  if (!habit.input) return Boolean(value);
  const target = targetFor(habit, bodyweightKg);
  if (typeof value !== "number" || Number.isNaN(value)) return false;
  return input_mode(habit) === "cap" ? value <= target : value >= target;
}

function input_mode(habit) {
  return habit.input?.mode ?? "floor";
}

const DEFAULT_ACTIVE = HABITS.filter((h) => h.defaultOn).map((h) => h.id);

/**
 * The measurements. Not habits: these are the feedback loop, and they are the
 * only numbers in the app that can tell you whether any of the rest worked.
 */
const MEASURES = [
  {
    id: "waist",

/**
 * Blood panel. One GP appointment, then annually. This is the metric set the

const BLOODS = [

  { id: "lipids", name: "Fasting lipids", note: "" },

  { id: "ferritin", name: "Ferritin and full blood count", note: "" },

/* ---- js/store.js ---- */
/**
 * Storage.
 *
 * Two stores, chosen by what the data is:
 *
 *   localStorage   Everything structured. Small, synchronous, survives
 *                  reinstall of the service worker, easy to export as one
 *                  JSON file the user actually owns.
 *   IndexedDB      Progress photos only. They are the one thing here that
 *                  would blow the ~5 MB localStorage budget, and they are
 *                  also the one thing that must never leave the device.
 *
 * Nothing syncs. There is no account and no server. That is a feature: the
 * data is a body log with photographs in it.
 */

const KEY = "blueprint.state.v1";
const DB_NAME = "blueprint-photos";
const DB_STORE = "photos";

const todayKey = (d = new Date()) => {
  const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
};

const dayOffset = (key, days) => {
  const d = new Date(key + "T12:00:00");
  d.setDate(d.getDate() + days);
  return todayKey(d);
};

const daysBetween = (a, b) =>
  Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);

function blankState() {
  return {
    v: 1,
    profile: { bodyweightKg: 75, wakeTime: "07:00", startedAt: todayKey() },
    active: null, // null means "not chosen yet", filled from DEFAULT_ACTIVE on first run
    log: {},
    measures: [],
    photos: [],
    bloods: [],
    experiments: [],
    reviews: [],
    theme: "auto",
  };
}

let state = load();
const listeners = new Set();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return blankState();
    const parsed = JSON.parse(raw);
    return { ...blankState(), ...parsed, profile: { ...blankState().profile, ...parsed.profile } };
  } catch {
    return blankState();
  }
}

function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (err) {
    // A full quota should never silently eat a day's log.
    console.warn("Could not save", err);
    notifyQuota();
  }
}

let quotaHandler = null;
const onQuotaError = (fn) => (quotaHandler = fn);
const notifyQuota = () => quotaHandler?.();

const getState = () => state;

function subscribe(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

/** Every mutation goes through here so persistence and repaint cannot drift. */
function update(mutator) {
  const draft = structuredClone(state);
  mutator(draft);
  state = draft;
  persist();
  listeners.forEach((fn) => fn(state));
}

/* ------------------------------------------------------------- daily log */

function dayLog(key = todayKey()) {
  return state.log[key] ?? {};
}

function setEntry(habitId, value, key = todayKey()) {
  update((s) => {
    const day = { ...(s.log[key] ?? {}) };
    if (value === false || value === null || value === undefined || value === "") {
      delete day[habitId];
    } else {
      day[habitId] = value;
    }
    if (Object.keys(day).length === 0) delete s.log[key];
    else s.log[key] = day;
  });
}

function toggleActive(habitId) {
  update((s) => {
    const set = new Set(s.active ?? []);
    set.has(habitId) ? set.delete(habitId) : set.add(habitId);
    s.active = [...set];
  });
}

/* ------------------------------------------------------------- measures */

function addMeasure(entry) {
  update((s) => {
    // One measurement row per date. Re-measuring the same day corrects it
    // rather than adding a second point to the chart.
    const i = s.measures.findIndex((m) => m.date === entry.date);
    if (i >= 0) s.measures[i] = { ...s.measures[i], ...entry };
    else s.measures.push(entry);
    s.measures.sort((a, b) => a.date.localeCompare(b.date));
  });
}

function removeMeasure(date) {
  update((s) => {
    s.measures = s.measures.filter((m) => m.date !== date);
  });
}

function addBloods(entry) {
  update((s) => {
    s.bloods.push(entry);
    s.bloods.sort((a, b) => b.date.localeCompare(a.date));
  });
}

/* ----------------------------------------------------------- experiments */

function addExperiment(exp) {
  update((s) => s.experiments.push(exp));
}

function patchExperiment(id, patch) {
  update((s) => {
    const i = s.experiments.findIndex((e) => e.id === id);
    if (i >= 0) s.experiments[i] = { ...s.experiments[i], ...patch };
  });
}

function removeExperiment(id) {
  update((s) => {
    s.experiments = s.experiments.filter((e) => e.id !== id);
  });
}

function addReview(review) {
  update((s) => s.reviews.unshift(review));
}

function setProfile(patch) {
  update((s) => Object.assign(s.profile, patch));
}

function setTheme(theme) {
  update((s) => (s.theme = theme));
  applyTheme(theme);
}

function applyTheme(theme = state.theme) {
  const root = document.documentElement;
  if (theme === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", theme);
}

/* ---------------------------------------------------------------- photos */

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(DB_STORE)) req.result.createObjectStore(DB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idb(mode, fn) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, mode);
    const req = fn(tx.objectStore(DB_STORE));
    tx.oncomplete = () => resolve(req?.result);
    tx.onerror = () => reject(tx.error);
  });
}

/**
 * Photos are downscaled before they are stored. A modern phone camera file is
 * 3 to 6 MB, and a progress photo needs to answer one question: has the shape
 * changed. 1280px on the long edge answers it at about 150 KB.
 */
async function storePhoto(file, meta) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 1280 / Math.max(bitmap.width, bitmap.height));
  const w = Math.round(bitmap.width * scale);
  const h = Math.round(bitmap.height * scale);
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
  bitmap.close?.();

  const blob = await new Promise((res) => canvas.toBlob(res, "image/jpeg", 0.82));
  const id = `p_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
  await idb("readwrite", (store) => store.put(blob, id));
  update((s) => s.photos.push({ id, date: todayKey(), ...meta }));
  return id;
}

const readPhoto = (id) => idb("readonly", (store) => store.get(id));

async function deletePhoto(id) {
  await idb("readwrite", (store) => store.delete(id));
  update((s) => {
    s.photos = s.photos.filter((p) => p.id !== id);
  });
}

/* ---------------------------------------------------------------- export */

async function exportAll() {
  const photos = {};
  for (const p of state.photos) {
    const blob = await readPhoto(p.id);
    if (blob) photos[p.id] = await blobToDataUrl(blob);
  }
  return JSON.stringify({ exportedAt: new Date().toISOString(), state, photos }, null, 2);
}

async function importAll(json) {
  const parsed = JSON.parse(json);
  if (!parsed.state?.v) throw new Error("That file is not a Blueprint export.");
  for (const [id, dataUrl] of Object.entries(parsed.photos ?? {})) {
    await idb("readwrite", (store) => store.put(dataUrlToBlob(dataUrl), id));
  }
  state = { ...blankState(), ...parsed.state };
  persist();
  listeners.forEach((fn) => fn(state));
}

async function wipeAll() {
  localStorage.removeItem(KEY);
  await idb("readwrite", (store) => store.clear());
  state = blankState();
  persist();
  listeners.forEach((fn) => fn(state));
}

const blobToDataUrl = (blob) =>
  new Promise((res) => {
    const reader = new FileReader();
    reader.onload = () => res(reader.result);
    reader.readAsDataURL(blob);
  });

function dataUrlToBlob(dataUrl) {
  const [head, body] = dataUrl.split(",");
  const mime = head.match(/:(.*?);/)[1];
  const bin = atob(body);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

/* ---- js/score.js ---- */
/**
 * Scoring.
 *
 * Two decisions here carry the whole design.
 *
 * 1. Adherence, not streaks. A streak makes one bad Saturday feel like
 *    failure, and the standard response to a broken streak is to quit. The
 *    metric the source material actually argues for is "how many weeks in a
 *    row did you hit three sessions", which survives a night out. So the
 *    headline number is a rolling percentage and the app never shows a
 *    consecutive-day counter.
 *
 * 2. Experimental habits score zero. They are counted, charted and reviewed,
 *    but they cannot move the number. Otherwise a week of thumbpulling and no
 *    sleep reads as a good week, which is exactly the failure this app exists
 *    to prevent.
 */


/** Was this habit satisfied on this day, whatever kind of input it takes. */
function isMet(habit, entry, bodyweightKg) {
  if (entry === undefined) return false;
  if (habit.input) return meetsTarget(habit, Number(entry), bodyweightKg);
  return entry === true;
}

/** Habits due on a given day, respecting cadence and what the user turned on. */
function dueOn(state, key = todayKey()) {
  const active = state.active ?? [];
  const date = new Date(key + "T12:00:00");
  return active
    .map((id) => BY_ID[id])
    .filter(Boolean)
    .filter((h) => {
      if (h.cadence === "daily") return true;
      // Weekly and monthly habits surface on a fixed day so they cannot be
      // silently missed, and so they do not drag the daily score every day.
      if (h.cadence === "weekly") return date.getDay() === 0;
      if (h.cadence === "monthly") return date.getDate() === 1;
      return false;
    });
}

function dayScore(state, key = todayKey()) {
  const log = state.log[key] ?? {};
  const bw = state.profile.bodyweightKg;
  let earned = 0;
  let possible = 0;
  const tally = { foundation: [0, 0], compounding: [0, 0], experimental: [0, 0] };

  for (const habit of dueOn(state, key)) {
    const met = isMet(habit, log[habit.id], bw);
    const t = tally[habit.tier];
    t[1] += 1;
    if (met) t[0] += 1;

    const weight = TIERS[habit.tier].weight;
    if (weight === 0) continue;
    possible += weight;
    if (met) earned += weight;
  }

  return {
    earned,
    possible,
    pct: possible === 0 ? null : Math.round((earned / possible) * 100),
    tally,
  };
}

/** Rolling adherence across a window ending today. Days before you started are ignored. */
function adherence(state, days = 7, endKey = todayKey()) {
  let earned = 0;
  let possible = 0;
  for (let i = 0; i < days; i += 1) {
    const key = dayOffset(endKey, -i);
    if (key < state.profile.startedAt) break;
    const s = dayScore(state, key);
    earned += s.earned;
    possible += s.possible;
  }
  return possible === 0 ? null : Math.round((earned / possible) * 100);
}

/** Per-habit adherence over a window. Drives the library and experiment views. */
function habitAdherence(state, habitId, days = 28, endKey = todayKey()) {
  const habit = BY_ID[habitId];
  if (!habit) return null;
  const bw = state.profile.bodyweightKg;
  let hit = 0;
  let seen = 0;
  for (let i = 0; i < days; i += 1) {
    const key = dayOffset(endKey, -i);
    if (key < state.profile.startedAt) break;
    seen += 1;
    if (isMet(habit, (state.log[key] ?? {})[habitId], bw)) hit += 1;
  }
  return seen === 0 ? null : { hit, seen, pct: Math.round((hit / seen) * 100) };
}

/**
 * Sessions per week, the metric the source material puts above all the daily
 * ones. Counts any training habit that was logged.
 */
const TRAINING = ["lift", "sport", "mace", "dand-bethak", "rings", "zone2"];

function weeklySessions(state, weeksBack = 4, endKey = todayKey()) {
  const weeks = [];
  for (let w = 0; w < weeksBack; w += 1) {
    let count = 0;
    for (let d = 0; d < 7; d += 1) {
      const key = dayOffset(endKey, -(w * 7 + d));
      const log = state.log[key] ?? {};
      if (TRAINING.some((id) => log[id])) count += 1;
    }
    weeks.push(count);
  }
  return weeks; // index 0 is the current week
}

/** Consecutive weeks hitting the three-session bar, counting back from now. */
function weeksAtThree(state, endKey = todayKey()) {
  const weeks = weeklySessions(state, 26, endKey);
  let n = 0;
  // The current week is still in progress, so it can only add, never break.
  for (let i = weeks[0] >= 3 ? 0 : 1; i < weeks.length; i += 1) {
    if (weeks[i] >= 3) n += 1;
    else break;
  }
  return n;
}

/* --------------------------------------------------------------- history */

function history(state, days = 28, endKey = todayKey()) {
  const out = [];
  for (let i = days - 1; i >= 0; i -= 1) {
    const key = dayOffset(endKey, -i);
    const s = dayScore(state, key);
    out.push({ key, pct: s.pct, logged: Object.keys(state.log[key] ?? {}).length > 0 });
  }
  return out;
}

/* ----------------------------------------------------------- experiments */

/**
 * How faithfully an experiment was actually run. Without this number a
 * finished trial says nothing, because "it did not work" and "I did it nine
 * times" are different results.
 */
function experimentAdherence(state, exp) {
  const habit = BY_ID[exp.habitId];
  if (!habit) return null;
  const bw = state.profile.bodyweightKg;
  const end = exp.endDate < todayKey() ? exp.endDate : todayKey();
  let hit = 0;
  let seen = 0;
  let key = exp.startDate;
  while (key <= end) {
    seen += 1;
    if (isMet(habit, (state.log[key] ?? {})[exp.habitId], bw)) hit += 1;
    key = dayOffset(key, 1);
  }
  return { hit, seen, pct: seen === 0 ? 0 : Math.round((hit / seen) * 100) };
}

/* ---------------------------------------------------------- what is due */

const CADENCE_DAYS = { weekly: 7, monthly: 30, quarterly: 91, yearly: 365 };

function measureOverdue(state, measureId, cadence = "monthly") {
  const last = [...state.measures].reverse().find((m) => m[measureId] != null);
  if (!last) return { overdue: true, days: null };
  const days = Math.round((new Date() - new Date(last.date + "T12:00:00")) / 86400000);
  return { overdue: days >= CADENCE_DAYS[cadence], days, last };
}

/* ---- js/ui.js ---- */
/**
 * DOM helpers and the shared sheet.
 *
 * No framework. The app has five screens and one modal, and a hyperscript
 * helper plus full repaints on state change is both fast enough and far
 * easier to read than a hand-rolled diff. Repaint cost is a few hundred
 * nodes.
 */

/** h("div.klass", {props}, ...children) */
function h(spec, props, ...kids) {
  const [tag, ...classes] = spec.split(".");
  const node = document.createElement(tag || "div");
  if (classes.length) node.className = classes.join(" ");

  if (props && (props.nodeType || typeof props !== "object" || Array.isArray(props))) {
    kids.unshift(props);
    props = null;
  }

  for (const [key, value] of Object.entries(props ?? {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") node.className = [node.className, value].filter(Boolean).join(" ");
    else if (key === "html") node.innerHTML = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2).toLowerCase(), value);
    else if (key === "style" && typeof value === "object") Object.assign(node.style, value);
    else if (key in node && key !== "list" && typeof value !== "boolean") node[key] = value;
    else node.setAttribute(key, value === true ? "" : value);
  }

  for (const kid of kids.flat(3)) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return node;
}

/** Phosphor symbol from the vendored sprite. Never a hand-drawn path. */
function icon(name, extra) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  if (extra) svg.setAttribute("class", extra);
  svg.setAttribute("aria-hidden", "true");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", `#i-${name}`);
  svg.append(use);
  return svg;
}

const clear = (node) => {
  while (node.firstChild) node.firstChild.remove();
  return node;
};

/* --------------------------------------------------------------- format */

const fmtDate = (key) =>
  new Date(key + "T12:00:00").toLocaleDateString(undefined, {
    weekday: "short",
    day: "numeric",
    month: "short",
  });

const fmtShort = (key) =>
  new Date(key + "T12:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short" });

const fmtNum = (value, digits = 0) =>
  value === null || value === undefined || Number.isNaN(value) ? "-" : Number(value).toFixed(digits);

const uid = (prefix) => `${prefix}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;

/* ---------------------------------------------------------------- sheet */

let closeCurrent = null;

function openSheet(build) {
  closeSheet();

  const scrim = h("div.scrim", { onclick: closeSheet });
  const sheet = h("div.sheet", { role: "dialog", "aria-modal": "true" }, h("div.grabber"));
  sheet.append(...[build(closeSheet)].flat().filter(Boolean));

  document.body.append(scrim, sheet);
  document.body.style.overflow = "hidden";

  const onKey = (e) => e.key === "Escape" && closeSheet();
  document.addEventListener("keydown", onKey);

  // Focus the sheet itself so screen readers and keyboards land inside it.
  sheet.tabIndex = -1;
  sheet.focus({ preventScroll: true });

  closeCurrent = () => {
    document.removeEventListener("keydown", onKey);
    scrim.remove();
    sheet.remove();
    document.body.style.overflow = "";
    closeCurrent = null;
  };
  return closeSheet;
}

function closeSheet() {
  closeCurrent?.();
}

/* --------------------------------------------------------------- badges */

const tierBadge = (tier) => h(`span.tier.${tier}`, TIERS[tier].label);

const evidenceLabel = (evidence) => h("span.ev", EVIDENCE[evidence].label);

function note(text, kind) {
  return h(
    `div.note${kind ? "." + kind : ""}`,
    icon(kind === "warn" ? "warning" : "info"),
    h("span", text)
  );
}

function empty(iconName, title, body, action) {
  return h("div.empty", icon(iconName), h("h3", title), h("p", body), action);
}

/**
 * The habit detail sheet. For a graded habit it shows why it earns its place.
 * For an unproven one it shows the claim and the counter-evidence next to each
 * other, because the argument is the content.
 */
function habitSheet(habit, extras = []) {
  return openSheet(() => [
    h("h2", habit.name),
    h("div.meta", tierBadge(habit.tier), evidenceLabel(habit.evidence)),

    habit.why && h("p", habit.why),

    habit.claim &&
      h("div.claim", h("div.who", "The claim"), h("p", habit.claim)),
    habit.counter &&
      h("div.claim.counter", h("div.who", "What the evidence says"), h("p", habit.counter)),

    habit.caution && h("div.caution", h("strong", "Caution. "), habit.caution),

    habit.source && h("div.source", habit.source),

    extras.length ? h("div.actions", ...extras) : null,
  ]);
}

/* ---- js/views/today.js ---- */
/**
 * Today.
 *
 * The screen that has to work at 7am. Two rules shape it:
 *
 *   Graded habits are grouped by life area, because that is the order you
 *   actually do them in, and each row wears its tier so the weighting is
 *   never a secret.
 *
 *   Experimental habits sit in their own block at the bottom, under a heading
 *   that says they do not count. They are logged in full. They just cannot
 *   make a bad week look like a good one.
 */




let viewing = todayKey();

function resetDay() {
  viewing = todayKey();
}

function today(state, rerender) {
  const key = viewing;
  const log = state.log[key] ?? {};
  const bw = state.profile.bodyweightKg;
  const due = dueOn(state, key);
  const score = dayScore(state, key);

  const graded = due.filter((x) => TIERS[x.tier].scored);
  const trials = due.filter((x) => !TIERS[x.tier].scored);

  const view = h("div.view");
  view.append(dateStrip(key, rerender));

  if (due.length === 0) {
    view.append(
      h(
        "div.panel",
        empty(
          "circle-dashed",
          "Nothing switched on yet",
          "Open the Library and turn on the habits you are actually running. Twelve are on by default."
        )
      )
    );
    return view;
  }

  view.append(scorePanel(state, score, key));

  for (const group of GROUPS) {
    const rows = graded.filter((x) => x.group === group.id);
    if (!rows.length) continue;
    view.append(
      h(
        "section.block",
        h("h2", group.label),
        h("div.panel.rows", ...rows.map((habit) => habitRow(habit, log[habit.id], bw, key, rerender)))
      )
    );
  }

  if (trials.length) {
    view.append(
      h(
        "section.block",
        h("h2", "Tracked, not scored"),
        h(
          "p.lede",
          "The evidence for these does not hold up, or holds up for something other than what it is sold for. " +
            "They are logged so you can see what you did. They do not move the number above."
        ),
        h("div.panel.rows", ...trials.map((habit) => habitRow(habit, log[habit.id], bw, key, rerender)))
      )
    );
  }

  return view;
}

/* ------------------------------------------------------------------- */

function dateStrip(key, rerender) {
  const isToday = key === todayKey();
  const go = (delta) => () => {
    const next = dayOffset(key, delta);
    if (next > todayKey()) return;
    viewing = next;
    rerender();
  };

  return h(
    "div",
    { style: { display: "flex", alignItems: "center", justifyContent: "space-between", gap: "8px" } },
    h("button.btn.quiet", { onclick: go(-1), "aria-label": "Previous day" }, icon("caret-left")),
    h(
      "div",
      { style: { textAlign: "center" } },
      h("div", { style: { fontSize: "14px", fontWeight: 600, letterSpacing: "-0.02em" } },
        isToday ? "Today" : fmtDate(key)),
      !isToday &&
        h("button.btn.quiet", { onclick: () => { viewing = todayKey(); rerender(); },
          style: { minHeight: "24px", fontSize: "12px" } }, "Back to today")
    ),
    h("button.btn.quiet", { onclick: go(1), disabled: isToday, "aria-label": "Next day" }, icon("caret-right"))
  );
}

function scorePanel(state, score, key) {
  const pct = score.pct ?? 0;
  const radius = 30;
  const circumference = 2 * Math.PI * radius;

  const ring = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  ring.setAttribute("class", "ring");
  ring.setAttribute("viewBox", "0 0 68 68");
  ring.innerHTML =
    `<circle class="track" cx="34" cy="34" r="${radius}"></circle>` +
    `<circle class="fill" cx="34" cy="34" r="${radius}" stroke-dasharray="${circumference}" ` +
    `stroke-dashoffset="${circumference * (1 - pct / 100)}"></circle>`;

  const d7 = adherence(state, 7);
  const d28 = adherence(state, 28);
  const weeks = weeksAtThree(state);

  return h(
    "div.panel",
    h(
      "div.score",
      ring,
      h(
        "div",
        h("div.score-figure", String(pct), h("sup", "%")),
        h(
          "div.score-label",
          `${score.earned} of ${score.possible} weighted points. ` +
            (score.tally.foundation[1]
              ? `Foundation ${score.tally.foundation[0]}/${score.tally.foundation[1]}.`
              : "")
        )
      )
    ),
    h(
      "dl.stats",
      h("div", h("dt", "7 day"), h("dd", d7 === null ? "-" : `${d7}%`)),
      h("div", h("dt", "28 day"), h("dd", d28 === null ? "-" : `${d28}%`)),
      h("div", h("dt", "Weeks at 3+"), h("dd", String(weeks)))
    ),
    sparkline(state, key)
  );
}

function sparkline(state, key) {
  const days = history(state, 28, key);
  return h(
    "div",
    h(
      "div.spark",
      ...days.map((d) =>
        h("span", {
          class: d.pct === null || !d.logged ? "off" : "",
          style: { height: `${Math.max(4, ((d.logged ? d.pct : 0) ?? 0) * 0.34 + 4)}px` },
          title: `${d.key}: ${d.logged ? (d.pct ?? 0) + "%" : "not logged"}`,
        })
      )
    ),
    h("div.axis", h("span", "28 days ago"), h("span", "now"))
  );
}

/* --------------------------------------------------------------- a row */

function habitRow(habit, entry, bw, key, rerender) {
  const met = isMet(habit, entry, bw);
  const target = targetFor(habit, bw);

  const row = h("div.hrow", {
    class: TIERS[habit.tier].scored ? "" : "experimental",
    "aria-pressed": met ? "true" : "false",
  });

  const tick = h("button.tick", {
    "aria-label": `${met ? "Undo" : "Complete"} ${habit.name}`,
    onclick: (e) => {
      e.stopPropagation();
      if (habit.input) openNumberSheet(habit, entry, bw, key, rerender);
      else {
        setEntry(habit.id, !met, key);
        rerender();
      }
    },
  }, icon("check"));

  const body = h(
    "button.hbody",
    {
      style: { background: "none", textAlign: "left", padding: 0 },
      onclick: () => (habit.input ? openNumberSheet(habit, entry, bw, key, rerender) : habitSheet(habit)),
    },
    h("div.hname", habit.name, habit.tier === "foundation" ? h("span.tier.foundation", "Core") : null),
    h("div.hsub", habit.input && target ? `Target ${target} ${habit.input.unit}` : habit.short)
  );

  row.append(tick, body);

  if (habit.input) {
    row.append(
      h(
        "div.hval",
        { class: entry === undefined ? "none" : "" },
        h("b", entry === undefined ? "-" : String(entry)),
        habit.input.unit
      )
    );
  }

  row.append(
    h("button.info", { "aria-label": `About ${habit.name}`, onclick: () => habitSheet(habit) }, icon("info"))
  );

  return row;
}

function openNumberSheet(habit, entry, bw, key, rerender) {
  const target = targetFor(habit, bw);
  let value = entry ?? "";

  openSheet((close) => {
    const input = h("input", {
      type: "number",
      inputmode: "decimal",
      step: habit.input.step ?? 1,
      min: 0,
      max: habit.input.max ?? 100000,
      value: String(value),
      id: `n-${habit.id}`,
    });

    const save = (raw) => {
      const n = Number(raw);
      setEntry(habit.id, Number.isFinite(n) && raw !== "" ? n : false, key);
      close();
      rerender();
    };

    const quick = [target, Math.round(target * 1.25), Math.round(target * 0.75)]
      .filter((n, i, arr) => n > 0 && arr.indexOf(n) === i)
      .sort((a, b) => a - b);

    return [
      h("h2", habit.name),
      h("div.meta", h("span.ev", `Floor ${target} ${habit.input.unit}`)),
      h(
        "div.field",
        { style: { marginTop: "14px" } },
        h("label", { for: `n-${habit.id}` }, `How much ${habit.input.unit === "steps" ? "" : "in " + habit.input.unit}`.trim()),
        input,
        h("div.help", habit.input.mode === "floor" ? "Clear the floor. Going far above it does not score higher." : "")
      ),
      h("div.chiprow", ...quick.map((n) => h("button.chip", { onclick: () => save(n) }, `${n} ${habit.input.unit}`))),
      h(
        "div.actions",
        h("button.btn.full", { onclick: () => save(input.value) }, icon("check"), "Save"),
        entry !== undefined &&
          h("button.btn.ghost.full", { onclick: () => save("") }, "Clear today"),
        h("button.btn.quiet", { onclick: () => { close(); habitSheet(habit); } }, "Why this habit")
      ),
    ];
  });
}

/**
 * Body.
 *
 * The feedback loop. Daily ticks tell you what you did; only this screen can
 * tell you whether it worked, which is why the app nags for a monthly waist
 * and a same-light photo rather than for another daily habit.
 *
 * Waist sits above weight on purpose. At the same BMI, South Asians carry
 * more abdominal and ectopic fat, so the scale flatters and the tape measure
 * does not.
 */




function body(state, rerender) {

/* ------------------------------------------------------------ measures */

function measurePanel(state, id, rerender) {
  const measure = MEASURES.find((m) => m.id === id);
  const points = state.measures.filter((m) => m[id] != null);
  const latest = points[points.length - 1];
  const previous = points[points.length - 2];
  const status = measureOverdue(state, id, "monthly");

  const panel = h("div.panel");

  if (!latest) {
    panel.append(
      empty(
        "ruler",
        `No ${measure.name.toLowerCase()} logged`,
        "One measurement now becomes the baseline everything later is compared against.",
        h("button.btn", { onclick: () => openMeasureSheet(state, id, rerender) }, icon("plus"), "Log the first one")
      )
    );
    return panel;
  }

  const delta = previous ? latest[id] - previous[id] : null;
  const over = measure.threshold && latest[id] >= measure.threshold.over;

  panel.append(
    h(
      "div.score",
      h(
        "div",
        { style: { flex: "1 1 auto" } },
        h(
          "div.score-figure",
          String(latest[id]),
          h("sup", measure.unit)
        ),
        h(
          "div.score-label",
          `${fmtDate(latest.date)}${
            delta === null ? "" : `. ${delta > 0 ? "Up" : delta < 0 ? "Down" : "No change"} ${Math.abs(delta).toFixed(1)} ${measure.unit} since last time`
          }`
        )
      ),
      h("button.btn.ghost", { onclick: () => openMeasureSheet(state, id, rerender) }, icon("plus"), "Log")
    )
  );

  if (points.length > 1) panel.append(lineChart(points, id, measure));

  if (over) {
    panel.append(
      h(
        "div",
        { style: { padding: "0 14px 14px" } },
        note(
          `${latest[id]} ${measure.unit} is at or above the ${measure.threshold.over} ${measure.unit} action threshold that the WHO and IDF set for Asian men. This is the number worth taking to a GP.`,
          "warn"
        )
      )
    );
  } else if (status.overdue) {
    panel.append(
      h(
        "div",
        { style: { padding: "0 14px 14px" } },
        note(`Last measured ${status.days} days ago. Monthly is the cadence that makes the chart mean anything.`)
      )
    );
  }

  return panel;
}

function lineChart(points, id, measure) {
  const values = points.map((p) => p[id]);
  const min = Math.min(...values, measure.threshold ? measure.threshold.over : Infinity);
  const max = Math.max(...values, measure.threshold ? measure.threshold.over : -Infinity);
  const pad = (max - min) * 0.18 || 1;
  const lo = min - pad;
  const hi = max + pad;

  const W = 300;
  const H = 130;
  const x = (i) => (points.length === 1 ? W / 2 : 10 + (i / (points.length - 1)) * (W - 20));
  const y = (v) => H - 16 - ((v - lo) / (hi - lo)) * (H - 34);

  const path = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[id]).toFixed(1)}`).join(" ");

  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "line");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `${measure.name} over time, ${values.length} measurements`);

  let markup = "";
  if (measure.threshold) {
    const ty = y(measure.threshold.over).toFixed(1);
    markup += `<line class="threshold" x1="6" y1="${ty}" x2="${W - 6}" y2="${ty}"></line>`;
  }
  markup += `<path d="${path}"></path>`;
  markup += points.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p[id]).toFixed(1)}" r="2.5"></circle>`).join("");
  svg.innerHTML = markup;

  return h(
    "div",
    svg,
    h(
      "div.axis",
      h("span", fmtShort(points[0].date)),
      measure.threshold ? h("span", `threshold ${measure.threshold.over} ${measure.unit}`) : null,
      h("span", fmtShort(points[points.length - 1].date))
    )
  );
}

function openMeasureSheet(state, id, rerender) {
  const measure = MEASURES.find((m) => m.id === id);
  const last = [...state.measures].reverse().find((m) => m[id] != null);

  openSheet((close) => {
    const value = h("input", {
      type: "number",
      inputmode: "decimal",
      step: measure.step,
      value: last ? String(last[id]) : "",
      id: "m-value",
    });
    const date = h("input", { type: "date", value: todayKey(), max: todayKey(), id: "m-date" });
    const err = h("div.err");

    return [
      h("h2", measure.name),
      h("p", measure.why),
      h("div.source", measure.source),
      h(
        "div",
        { style: { marginTop: "20px" } },
        h("div.field", h("label", { for: "m-value" }, `Measurement in ${measure.unit}`), value, err),
        h("div.field", h("label", { for: "m-date" }, "Date"), date)
      ),
      h(
        "div.actions",
        h(
          "button.btn.full",
          {
            onclick: () => {
              const n = Number(value.value);
              if (!Number.isFinite(n) || n <= 0) {
                err.textContent = "Enter a number greater than zero.";
                return;
              }
              addMeasure({ date: date.value || todayKey(), [id]: n });
              close();
              rerender();
            },
          },
          icon("check"),
          "Save"
        ),
        last &&
          h(
            "button.btn.ghost.full",
            {
              onclick: () => {
                removeMeasure(last.date);
                close();
                rerender();
              },
            },
            icon("trash"),
            `Delete the ${fmtShort(last.date)} entry`
          )
      ),
    ];
  });
}

/* ---- js/views/trials.js ---- */
/**
 * Trials.
 *
 * The answer to "but he has case studies". A case study is the weakest
 * evidence there is: self-selected, self-reported, uncontrolled, and
 * photographed by the person selling the outcome. You cannot run a controlled
 * trial on yourself, but you can fix the four things that make a personal
 * result worth anything:
 *
 *   1. A baseline recorded before you start, and locked afterwards.
 *   2. An endpoint written down in advance, so the goalposts cannot move.
 *   3. A fixed duration, so it ends whether or not you like the answer.
 *   4. Adherence measured alongside the result, because "it did not work"
 *      and "I did it nine times" are different findings.
 *
 * Run one at a time. Change five things and you learn nothing about any of
 * them, which is the one-variable rule the review screen also enforces.
 */




const DURATIONS = [
  { weeks: 8, label: "8 weeks", hint: "Enough for skin and sleep changes" },
  { weeks: 12, label: "12 weeks", hint: "Enough for body composition" },
  { weeks: 16, label: "16 weeks", hint: "The minimum honest window for a structural claim" },
];

function trials(state, rerender) {
  const view = h("div.view");
  const running = state.experiments.filter((e) => e.status === "running");
  const done = state.experiments.filter((e) => e.status !== "running");

  view.append(
    h(
      "section.block",
      h("h2", "Trials"),
      h(
        "p.lede",
        "Take any habit whose evidence does not hold up, and find out whether it works on you. " +
          "Baseline locked before you start, endpoint written down in advance, adherence reported with the result."
      ),
      h("button.btn.full", { onclick: () => openNewTrial(state, rerender) }, icon("flask"), "Start a trial")
    )
  );

  if (running.length > 1) {
    view.append(
      note(
        `${running.length} trials running at once. Whatever happens, you will not know which one caused it. One at a time is the whole method.`,
        "warn"
      )
    );
  }

  if (running.length) {
    view.append(
      h("section.block", h("h2", "Running"), h("div.panel.rows", ...running.map((e) => trialRow(state, e, rerender))))
    );
  }

  if (done.length) {
    view.append(
      h("section.block", h("h2", "Finished"), h("div.panel.rows", ...done.map((e) => trialRow(state, e, rerender))))
    );
  }

  if (!running.length && !done.length) {
    view.append(
      h(
        "div.panel",
        empty(
          "flask",
          "No trials yet",
          "Thumbpulling, mewing, hard gum, cold showers. Pick the one you most want to be true and give it a fair test."
        )
      )
    );
  }

  return view;
}

function trialRow(state, exp, rerender) {
  const habit = BY_ID[exp.habitId];
  const adherence = experimentAdherence(state, exp);
  const elapsed = daysBetween(exp.startDate, todayKey());
  const total = daysBetween(exp.startDate, exp.endDate);
  const finished = todayKey() >= exp.endDate;

  return h(
    "button.hrow",
    { onclick: () => openTrial(state, exp, rerender) },
    h(
      "div.hbody",
      h("div.hname", habit?.name ?? exp.habitId,
        exp.status === "complete" ? h("span.tier.compounding", verdictWord(exp.result?.verdict)) : null),
      h(
        "div.hsub",
        exp.status === "running"
          ? finished
            ? "Ready to close out"
            : `Day ${Math.max(1, elapsed + 1)} of ${total + 1}, ${adherence.pct}% adherence`
          : `${fmtShort(exp.startDate)} to ${fmtShort(exp.endDate)}, ${exp.result?.adherencePct ?? adherence.pct}% adherence`
      )
    ),
    h(
      "div.hval",
      exp.status === "running"
        ? h("b", finished ? "Due" : `${Math.max(0, total - elapsed)}d`)
        : h("b", verdictWord(exp.result?.verdict))
    ),
    icon("caret-right", "info")
  );
}

const verdictWord = (v) => (v === "yes" ? "Worked" : v === "no" ? "No effect" : v === "unclear" ? "Unclear" : "Open");

/* ----------------------------------------------------------- new trial */

function openNewTrial(state, rerender) {
  const candidates = HABITS.filter((x) => !TIERS[x.tier].scored || x.evidence === "contested");
  const alreadyRunning = new Set(
    state.experiments.filter((e) => e.status === "running").map((e) => e.habitId)
  );

  openSheet((close) => [
    h("h2", "What are you testing?"),
    h(
      "p",
      "These are the habits whose stated mechanism does not hold up, or holds up for something other than what it is sold for. A trial is how you find out what it does for you."
    ),
    h(
      "div.panel.rows",
      { style: { marginTop: "16px" } },
      ...candidates.map((habit) =>
        h(
          "button.hrow",
          {
            disabled: alreadyRunning.has(habit.id),
            onclick: () => {
              close();
              openTrialSetup(habit, state, rerender);
            },
          },
          h(
            "div.hbody",
            h("div.hname", habit.name),
            h("div.hsub", alreadyRunning.has(habit.id) ? "Already running" : habit.short)
          ),
          icon("caret-right", "info")
        )
      )
    ),
  ]);
}

function openTrialSetup(habit, state, rerender) {
  let weeks = 12;

  openSheet((close) => {
    const question = h("textarea", {
      id: "t-q",
      value: habit.claim ?? `Does ${habit.name.toLowerCase()} do anything measurable for me?`,
    });
    const endpoint = h("textarea", {
      id: "t-e",
      placeholder: suggestEndpoint(habit),
    });
    const baselineNote = h("textarea", {
      id: "t-b",
      placeholder: "Where you are starting from, in your own words. Be specific enough that you cannot argue with it later.",
    });
    const err = h("div.err");

    const durationRow = h(
      "div.chiprow",
      ...DURATIONS.map((d) =>
        h(
          "button.chip",
          {
            "aria-pressed": d.weeks === weeks ? "true" : "false",
            onclick: (e) => {
              weeks = d.weeks;
              [...durationRow.children].forEach((c) =>
                c.setAttribute("aria-pressed", c === e.currentTarget ? "true" : "false")
              );
              hint.textContent = d.hint;
            },
          },
          d.label
        )
      )
    );
    const hint = h("div.help", DURATIONS.find((d) => d.weeks === weeks).hint);

    return [
      h("h2", habit.name),
      h("div.meta", h("span.tier.experimental", "Experimental"), h("span.ev", "The claim, tested")),

      habit.counter && h("div.claim.counter", h("div.who", "What the evidence says now"), h("p", habit.counter)),

      h(
        "div",
        { style: { marginTop: "20px" } },
        h("div.field", h("label", { for: "t-q" }, "The claim you are testing"), question),
        h(
          "div.field",
          h("label", { for: "t-e" }, "What would count as it working"),
          endpoint,
          h(
            "div.help",
            "Write this before you start. An endpoint decided afterwards is how every before-and-after on the internet gets made."
          ),
          err
        ),
        h("div.field", h("label", {}, "How long"), durationRow, hint),
        h(
          "div.field",
          h("label", { for: "t-b" }, "Baseline"),
          baselineNote,
          h("div.help", "Locked once the trial starts. Add baseline photos on the Body screen today, in the light you can reproduce.")
        )
      ),

      habit.caution && h("div.caution", h("strong", "Caution. "), habit.caution),

      h(
        "div.actions",
        h(
          "button.btn.full",
          {
            onclick: () => {
              if (!endpoint.value.trim()) {
                err.textContent = "An endpoint is the one field that cannot be skipped. Without it the trial cannot fail.";
                endpoint.focus();
                return;
              }
              const start = todayKey();
              addExperiment({
                id: uid("ex"),
                habitId: habit.id,
                question: question.value.trim(),
                endpoint: endpoint.value.trim(),
                weeks,
                startDate: start,
                endDate: dayOffset(start, weeks * 7),
                baseline: {
                  note: baselineNote.value.trim(),
                  waist: latestWaist(state),
                  recordedAt: start,
                },
                status: "running",
              });
              close();
              rerender();
            },
          },
          icon("flask"),
          "Lock the baseline and start"
        ),
        h("button.btn.quiet", { onclick: () => { close(); habitSheet(habit); } }, "Read the evidence first")
      ),
    ];
  });
}

function suggestEndpoint(habit) {
  if (habit.group === "face")
    return "For example: side-profile photo in the same light shows a change a friend can pick out blind, at 16 weeks.";
  if (habit.id === "cold-shower") return "For example: I feel better in the two hours after, on most days I do it.";
  return "For example: a change I can point to in a photo or a number, not a feeling I have on the day.";
}

const latestWaist = (state) => {
  const last = [...state.measures].reverse().find((m) => m.waist != null);
  return last?.waist ?? null;
};

/* ---------------------------------------------------------- open trial */

function openTrial(state, exp, rerender) {
  const habit = BY_ID[exp.habitId];
  const adherence = experimentAdherence(state, exp);
  const finished = todayKey() >= exp.endDate;

  openSheet((close) => {
    const parts = [
      h("h2", habit?.name ?? exp.habitId),
      h(
        "div.meta",
        h("span.ev", `${fmtShort(exp.startDate)} to ${fmtShort(exp.endDate)}`),
        h("span.ev", `${adherence.pct}% adherence`)
      ),
      h("div.claim", h("div.who", "Testing"), h("p", exp.question)),
      h("div.claim.counter", h("div.who", "Endpoint, set in advance"), h("p", exp.endpoint)),
    ];

    if (exp.baseline?.note || exp.baseline?.waist != null) {
      parts.push(
        h(
          "div.claim",
          h("div.who", `Baseline, locked ${fmtShort(exp.baseline.recordedAt ?? exp.startDate)}`),
          h(
            "p",
            [exp.baseline.note, exp.baseline.waist != null ? `Waist ${exp.baseline.waist} cm.` : null]
              .filter(Boolean)
              .join(" ")
          )
        )
      );
    }

    if (exp.status === "running") {
      parts.push(
        h(
          "div",
          { style: { marginTop: "16px" } },
          note(
            `Logged on ${adherence.hit} of ${adherence.seen} days so far. Whatever the result, it is only worth as much as this number.`
          )
        )
      );

      parts.push(
        h(
          "div.actions",
          finished
            ? h("button.btn.full", { onclick: () => { close(); openCloseOut(state, exp, rerender); } }, icon("seal-check"), "Close it out")
            : h(
                "button.btn.ghost.full",
                { disabled: true },
                icon("clock"),
                `${daysBetween(todayKey(), exp.endDate)} days to go`
              ),
          h(
            "button.btn.quiet",
            {
              onclick: () => {
                patchExperiment(exp.id, { status: "abandoned", result: { verdict: "unclear", note: "Stopped early.", adherencePct: adherence.pct } });
                close();
                rerender();
              },
            },
            "Stop early"
          )
        )
      );
    } else {
      parts.push(
        h("div.claim", h("div.who", `Result, ${verdictWord(exp.result?.verdict).toLowerCase()}`), h("p", exp.result?.note || "No note recorded.")),
        h(
          "div.actions",
          h("button.btn.ghost.full", { onclick: () => { removeExperiment(exp.id); close(); rerender(); } }, icon("trash"), "Delete this trial")
        )
      );
    }

    return parts;
  });
}

function openCloseOut(state, exp, rerender) {
  const habit = BY_ID[exp.habitId];
  const adherence = experimentAdherence(state, exp);
  let verdict = null;

  openSheet((close) => {
    const noteField = h("textarea", { id: "r-note", placeholder: "What actually changed, against the endpoint you wrote at the start." });
    const err = h("div.err");

    const row = h(
      "div.chiprow",
      ...[
        ["yes", "It worked"],
        ["no", "No effect"],
        ["unclear", "Cannot tell"],
      ].map(([value, label]) =>
        h(
          "button.chip",
          {
            onclick: (e) => {
              verdict = value;
              [...row.children].forEach((c) => c.setAttribute("aria-pressed", c === e.currentTarget ? "true" : "false"));
            },
          },
          label
        )
      )
    );

    return [
      h("h2", "Close out the trial"),
      h("div.claim.counter", h("div.who", "The endpoint you set on day one"), h("p", exp.endpoint)),
      adherence.pct < 70
        ? h(
            "div.caution",
            h("strong", "Low adherence. "),
            `You logged this on ${adherence.hit} of ${adherence.seen} days. That is not enough to call it either way, and saying so is a more useful result than pretending otherwise.`
          )
        : null,
      h(
        "div",
        { style: { marginTop: "18px" } },
        h("div.field", h("label", {}, "Against that endpoint"), row, err),
        h("div.field", h("label", { for: "r-note" }, "What changed"), noteField)
      ),
      h(
        "div.actions",
        h(
          "button.btn.full",
          {
            onclick: () => {
              if (!verdict) {
                err.textContent = "Pick one. Cannot tell is a legitimate answer.";
                return;
              }
              patchExperiment(exp.id, {
                status: "complete",
                result: {
                  verdict,
                  note: noteField.value.trim(),
                  adherencePct: adherence.pct,
                  closedAt: todayKey(),
                  waist: latestWaist(state),
                },
              });
              close();
              rerender();
            },
          },
          icon("seal-check"),
          "Record the result"
        )
      ),
    ];
  });
}

/* ---- js/views/library.js ---- */
/**
 * Library.
 *
 * Every habit in the corpus, what tier it sits in, and why. This is the
 * screen that makes the app defensible: nothing is on the daily list without
 * a reason you can read, and the unproven items are labelled as unproven
 * rather than quietly mixed in.
 *
 * Filtering is by tier rather than by body part, because the tier is the
 * thing most habit trackers hide.
 */




let filter = "all";
let query = "";

const FILTERS = [
  ["all", "All"],
  ["foundation", "Foundation"],
  ["compounding", "Compounding"],
  ["experimental", "Experimental"],
  ["on", "Switched on"],
];

function library(state, rerender) {
  const active = new Set(state.active ?? []);
  const view = h("div.view");

  const search = h("input", {
    type: "text",
    value: query,
    placeholder: "Search habits",
    "aria-label": "Search habits",
    oninput: (e) => {
      query = e.target.value;
      const at = e.target.selectionStart;
      rerender();
      const next = document.querySelector('input[aria-label="Search habits"]');
      next?.focus();
      next?.setSelectionRange(at, at);
    },
  });

  view.append(
    h(
      "section.block",
      h("h2", "Library"),
      h(
        "p.lede",
        `${HABITS.length} habits. ${active.size} switched on. Tier decides how much a habit is worth in the daily score, ` +
          "and experimental habits are worth nothing on purpose."
      ),
      search,
      h(
        "div.chiprow",
        { style: { marginTop: "12px" } },
        ...FILTERS.map(([id, label]) =>
          h(
            "button.chip",
            {
              "aria-pressed": filter === id ? "true" : "false",
              onclick: () => {
                filter = id;
                rerender();
              },
            },
            label
          )
        )
      )
    )
  );

  const matches = HABITS.filter((habit) => {
    if (filter === "on" && !active.has(habit.id)) return false;
    if (filter !== "all" && filter !== "on" && habit.tier !== filter) return false;
    if (!query.trim()) return true;
    const q = query.toLowerCase();
    return (
      habit.name.toLowerCase().includes(q) ||
      habit.short.toLowerCase().includes(q) ||
      (habit.why ?? habit.claim ?? "").toLowerCase().includes(q)
    );
  });

  if (!matches.length) {
    view.append(h("div.panel", empty("books", "Nothing matches", "Try a different filter or clear the search.")));
    return view;
  }

  for (const group of GROUPS) {
    const rows = matches.filter((x) => x.group === group.id);
    if (!rows.length) continue;
    view.append(
      h(
        "section.block",
        h("h2", group.label),
        h("div.panel.rows", ...rows.map((habit) => libraryRow(state, habit, active.has(habit.id), rerender)))
      )
    );
  }

  return view;
}

function libraryRow(state, habit, on, rerender) {
  const stats = on ? habitAdherence(state, habit.id, 28) : null;

  return h(
    "div.hrow",
    { class: TIERS[habit.tier].scored ? "" : "experimental" },
    h(
      "button.hbody",
      {
        style: { background: "none", textAlign: "left", padding: 0 },
        onclick: () =>
          habitSheet(habit, [
            h(
              "button.btn.full",
              {
                onclick: (e) => {
                  toggleActive(habit.id);
                  e.target.closest(".sheet")?.previousSibling?.click();
                  rerender();
                },
              },
              icon(on ? "x" : "plus"),
              on ? "Switch off" : "Switch on"
            ),
          ]),
      },
      h("div.hname", habit.name, tierBadge(habit.tier)),
      h(
        "div.hsub",
        stats ? `${EVIDENCE[habit.evidence].label}. ${stats.pct}% over 28 days` : `${EVIDENCE[habit.evidence].label}. ${habit.short}`
      )
    ),
    h(
      "button.toggle",
      {
        "aria-pressed": on ? "true" : "false",
        "aria-label": `${on ? "Switch off" : "Switch on"} ${habit.name}`,
        onclick: () => {
          toggleActive(habit.id);
          rerender();
        },
      },
      h("i")
    )
  );
}

/* ---- js/views/settings.js ---- */
/**
 * Settings, reviews, and the data you own.
 *
 * The review is the part that matters. Every four weeks the app asks what you
 * are changing, and lets you name exactly one thing. Changing five variables
 * at once is why most people cannot tell you which of their habits does
 * anything, and it is the difference between a tracker and a diary.
 */




function settings(state, rerender) {
  const view = h("div.view");

  view.append(reviewSection(state, rerender));
  view.append(profileSection(state, rerender));
  view.append(themeSection(state, rerender));
  view.append(dataSection(state, rerender));
  view.append(careSection());

  return view;
}

/* -------------------------------------------------------------- review */

function reviewDue(state) {
  const last = state.reviews[0];
  const since = daysBetween(last?.date ?? state.profile.startedAt, todayKey());
  return { due: since >= 28, since };
}

function reviewSection(state, rerender) {
  const { due, since } = reviewDue(state);
  const panel = h("div.panel");

  panel.append(
    h(
      "div",
      { style: { padding: "16px" } },
      h(
        "p",
        { style: { fontSize: "13.5px", color: "var(--text-2)", lineHeight: "1.6" } },
        due
          ? `${since} days since your last review. Compare against your first photos and your first waist measurement, then change one thing.`
          : `Next review in ${28 - since} days. Until then, run what you have.`
      ),
      h(
        "div",
        { style: { marginTop: "14px" } },
        h(
          "button.btn.full",
          { onclick: () => openReview(state, rerender), disabled: !due },
          icon("arrow-counter-clockwise"),
          due ? "Run the review" : "Not due yet"
        )
      )
    )
  );

  if (state.reviews.length) {
    panel.append(
      h(
        "div.rows",
        { style: { borderTop: "1px solid var(--line)" } },
        ...state.reviews.slice(0, 6).map((review) =>
          h(
            "div.hrow",
            h(
              "div.hbody",
              h("div.hname", review.change),
              h("div.hsub", `${fmtDate(review.date)}. ${review.note || "No note"}`)
            )
          )
        )
      )
    );
  }

  return h(
    "section.block",
    h("h2", "Four week review"),
    h("p.lede", "One variable at a time. Not five."),
    panel
  );
}

function openReview(state, rerender) {
  let choice = null;

  openSheet((close) => {
    const d28 = adherence(state, 28);
    const sessions = weeklySessions(state, 4);
    const noteField = h("textarea", { id: "rv-note", placeholder: "What the photos and the tape measure actually show." });
    const change = h("input", { type: "text", id: "rv-change", placeholder: "The one thing you are changing" });
    const err = h("div.err");

    return [
      h("h2", "Four week review"),
      h(
        "dl.stats",
        { style: { border: "1px solid var(--line)", borderRadius: "var(--r-surface)", marginTop: "16px" } },
        h("div", h("dt", "28 day"), h("dd", d28 === null ? "-" : `${d28}%`)),
        h("div", h("dt", "Sessions"), h("dd", sessions.join(" "))),
        h("div", h("dt", "Trials"), h("dd", String(state.experiments.filter((e) => e.status === "running").length)))
      ),
      h(
        "p",
        { style: { marginTop: "16px" } },
        "Compare this month's photos against week one, not against the mirror. Then pick one variable."
      ),
      h(
        "div",
        { style: { marginTop: "16px" } },
        h("div.field", h("label", { for: "rv-change" }, "The one change"), change,
          h("div.help", "Add a habit, drop a habit, adjust a target, or start a trial. One of them."), err),
        h("div.field", h("label", { for: "rv-note" }, "What you are seeing"), noteField)
      ),
      h(
        "div.actions",
        h(
          "button.btn.full",
          {
            onclick: () => {
              if (!change.value.trim()) {
                err.textContent = "Name the change. If nothing is changing, write that.";
                return;
              }
              addReview({
                id: uid("rv"),
                date: todayKey(),
                change: change.value.trim(),
                note: noteField.value.trim(),
                adherence: d28,
              });
              close();
              rerender();
            },
          },
          icon("check"),
          "Log the review"
        )
      ),
    ];
  });
}
